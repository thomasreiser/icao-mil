# Global military ICAO 24-bit hex ranges.
#
# Source of truth for the README. Edit this file; the README is regenerated
# automatically by the GitHub Actions workflow in .github/workflows/.
#
# Schema:
#   ranges:    active military hex allocations (rendered as the main table)
#   disabled:  ranges deliberately excluded upstream due to civilian collisions
#   gaps:      major military operators with no published sub-allocation
#   sources:   reference URLs cited at the bottom of the README
#
# Each range entry:
#   hex_start: 6-hex-digit ICAO 24-bit address (uppercase, no prefix)
#   hex_end:   inclusive end of the range
#   country:   country name as it should appear in the table
#   unit:      branch / service; leave empty string if unknown

